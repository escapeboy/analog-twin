# fleetq-01: /var/analog-twin. `app/` = build context (repo copy), `data/` = engine data (not in git).
services:
  api:
    build: { context: ./app, dockerfile: deploy/public/Dockerfile }
    image: analog-twin-api:latest
    container_name: analog-twin-api
    restart: always
    volumes:
      - ./data:/app/data
    mem_limit: 6g
    cpus: 4
    networks: [web]
  web:  # static offline bundle, kept as a fallback (switch the vhost upstream to analog-twin-web:80)
    image: nginx:stable-alpine
    container_name: analog-twin-web
    restart: always
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [web]
networks:
  web:
    name: analog-twin_web
