# Analog Twin public demo (NASA Space Apps 2026) on the shared nginx-proxy, fleetq-01.
# Upstream analog-twin-api:8000 on network analog-twin_web (/var/analog-twin). Fallback: analog-twin-web:80 (static).
# Rate limit per visitor (Cloudflare's CF-Connecting-IP; the origin is only reached through Cloudflare).
limit_req_zone $http_cf_connecting_ip zone=analogtwin_api:10m rate=4r/s;

server {
    listen 80;
    listen [::]:80;
    server_name analog-twin.fleetq.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name analog-twin.fleetq.net;

    ssl_certificate     /etc/nginx/certs/fleetq.net.crt;
    ssl_certificate_key /etc/nginx/certs/fleetq.net.key;

    client_max_body_size 64k;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $up http://analog-twin-api:8000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location /api/ {
        limit_req zone=analogtwin_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $up$request_uri;
        proxy_read_timeout 90s;
    }

    # crew event stream (server-sent events): no buffering
    location ~ ^/api/(campaign/[^/]+|replay/[^/]+)/events$ {
        limit_req zone=analogtwin_api burst=20 nodelay;
        proxy_pass $up$request_uri;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass $up$request_uri;
    }
}
